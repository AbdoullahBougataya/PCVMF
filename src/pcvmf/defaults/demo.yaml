logging:
  level: INFO
workers:
  - name: vision
    plugin:
      class: pcvmf.workers:VisionWorker
      options:
        source:
          class: pcvmf.vision.sources:SyntheticSource
          options: {width: 640, height: 480}
        pipeline:
          class: pcvmf.vision.pipeline:ColorTracker
          options: {min_area: 300, lower_hsv: [35, 100, 100], upper_hsv: [85, 255, 255]}
    rate_hz: 30
    publications: [vision/telemetry]
  - name: controller
    plugin:
      class: pcvmf.workers:ControllerWorker
    rate_hz: 50
    subscriptions:
      - {source: vision, topic: vision/telemetry, delivery: latest}
