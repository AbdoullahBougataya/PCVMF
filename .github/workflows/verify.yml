name: PCVMF Verifications
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - run: uv run --frozen black --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest
      - run: uv build
      - name: Install wheel and external examples into a clean environment
        run: |
          uv venv /tmp/pcvmf-wheel --python ${{ matrix.python-version }}
          uv pip install --python /tmp/pcvmf-wheel/bin/python -r requirements.txt dist/*.whl
          uv pip install --python /tmp/pcvmf-wheel/bin/python --no-deps ./examples/external_plugins
          /tmp/pcvmf-wheel/bin/python scripts/smoke.py
          /tmp/pcvmf-wheel/bin/python scripts/smoke.py --config examples/vision.yaml
          /tmp/pcvmf-wheel/bin/python scripts/smoke.py --config examples/sensor.yaml
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: docker build -t pcvmf:test .
      - run: docker run --rm pcvmf:test python /opt/pcvmf-smoke.py
