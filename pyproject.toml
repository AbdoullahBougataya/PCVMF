[project]
name = "PCVMF"
version = "0.2.0"
description = "Python Computer Vision Multiprocessing Framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ABDELLAH BOUGATAYA", email = "sience.story@gmail.com"}
]

# Core dependencies
dependencies = [
    "pyzmq>=24.0.0",
    "opencv-python>=4.6.0",
    "numpy>=1.21.0",
    "PyYAML>=6.0",
]

# Optional groups for development or testing
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
